<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task 4 - City vs Suburb</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>body { font-family: sans-serif; margin: 30px; }</style>
</head>
<body>
<h2>Task 4: City Centre vs Suburb PM2.5</h2>
<div id="chart"></div>

<script>
const margin = {top: 20, right: 30, bottom: 40, left: 50};
const width = 800 - margin.left - margin.right;
const height = 350 - margin.top - margin.bottom;

function parseRowDate(raw) {
if (raw instanceof Date) return raw;
if (typeof raw === "number") return new Date((raw - 25569) * 86400 * 1000);
return d3.timeParse("%Y-%m-%d")(String(raw).trim().split("T")[0]);}

async function loadData() {
try {
const res = await fetch("dataset/air_quality_2025.xlsx");
if (!res.ok) throw new Error();
const wb = XLSX.read(await res.arrayBuffer(), { type: "array", cellDates: true });
return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);} 
catch {return await d3.csv("dataset/air_quality_2025.csv");}
}

loadData().then(rows => {
const data = rows.map(d => ({
date: parseRowDate(d.date),
city: +d.pm25_city,
suburb: +d.pm25_suburb
})).filter(d => d.date && !isNaN(d.date)).sort((a,b) => a.date - b.date);

const svg = d3.select("#chart").append("svg").attr("width", width + margin.left + margin.right).attr("height", height + margin.top + margin.bottom).append("g").attr("transform", `translate(${margin.left},${margin.top})`);

const x = d3.scaleTime().domain(d3.extent(data, d => d.date)).range([0, width]);
const y = d3.scaleLinear().domain([0, d3.max(data, d => Math.max(d.city, d.suburb)) + 15]).range([height, 0]);

svg.append("g").attr("transform", `translate(0,${height})`).call(d3.axisBottom(x).tickFormat(d3.timeFormat("%b")));
svg.append("g").call(d3.axisLeft(y));

const cityLine = d3.line().x(d => x(d.date)).y(d => y(d.city));
const suburbLine = d3.line().x(d => x(d.date)).y(d => y(d.suburb));

svg.append("path").datum(data).attr("fill", "none").attr("stroke", "#2563eb").attr("stroke-width", 1.5).attr("d", cityLine);
svg.append("path").datum(data).attr("fill", "none").attr("stroke", "#10b981").attr("stroke-width", 1.5).attr("stroke-dasharray", "3 2").attr("d", suburbLine);

const legend = svg.append("g").attr("transform", `translate(${width - 150}, 10)`);
[{name: "City Centre", color: "#2563eb", dash: "none"}, {name: "Suburb", color: "#10b981", dash: "3 2"}].forEach((item, i) => {
legend.append("line").attr("x1", 0).attr("x2", 20).attr("y1", i * 20).attr("y2", i * 20)
.attr("stroke", item.color).attr("stroke-width", 2).attr("stroke-dasharray", item.dash);
legend.append("text").attr("x", 26).attr("y", i * 20 + 4).attr("font-size", "12px").text(item.name);});
});
</script>
</body>
</html>
