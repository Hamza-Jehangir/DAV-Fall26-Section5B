<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task 6 - Heatmap</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body { font-family: sans-serif; margin: 30px; }
.tooltip { position: absolute; background: #000; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; pointer-events: none; opacity: 0; }
</style>
</head>
<body>
<h2>Task 6: Month vs Day-of-Week Heatmap</h2>
<div id="chart"></div>
<div id="tooltip" class="tooltip"></div>

<script>
const margin = { top: 20, right: 30, bottom: 40, left: 50 };
const width = 800 - margin.left - margin.right;
const height = 300 - margin.top - margin.bottom;

function parseRowDate(raw) {
if (raw instanceof Date) return raw;
if (typeof raw === "number") return new Date((raw - 25569) * 86400 * 1000);
return d3.timeParse("%Y-%m-%d")(String(raw).trim().split("T")[0]);}

async function loadData() {
try {
const res = await fetch("dataset/air_quality_2025.xlsx");
if (!res.ok) throw new Error();
const wb = XLSX.read(await res.arrayBuffer(), { type: "array", cellDates: true });
return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);} 
catch {return await d3.csv("dataset/air_quality_2025.csv");}}

loadData().then(rows => {
const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

const data = rows.map(d => ({
date: parseRowDate(d.date),
pm25: +d.pm25_city
})).filter(d => d.date && !isNaN(d.date));

const roll = d3.rollups(data,
v => d3.mean(v, d => d.pm25),
d => d.date.getMonth(),
d => dayNames[d.date.getDay()]);

const cells = [];
roll.forEach(([mIdx, dayMap]) => {
dayMap.forEach(([day, val]) => {
cells.push({ month: months[mIdx], day, val });});
});

const svg = d3.select("#chart").append("svg").attr("width", width + margin.left + margin.right).attr("height", height + margin.top + margin.bottom).append("g").attr("transform", `translate(${margin.left},${margin.top})`);

const x = d3.scaleBand().domain(months).range([0, width]).padding(0.05);
const y = d3.scaleBand().domain(days).range([0, height]).padding(0.05);
const color = d3.scaleSequential(d3.interpolateYlOrRd).domain(d3.extent(cells, d => d.val));

svg.append("g").attr("transform", `translate(0,${height})`).call(d3.axisBottom(x));
svg.append("g").call(d3.axisLeft(y));

const tooltip = d3.select("#tooltip");

svg.selectAll("rect").data(cells).join("rect").attr("x", d => x(d.month)).attr("y", d => y(d.day)).attr("width", x.bandwidth()).attr("height", y.bandwidth()).attr("fill", d => color(d.val))
.on("mouseover", (event, d) => {
tooltip.style("opacity", 1).html(`${d.month} ${d.day}: ${d.val.toFixed(1)} µg/m³`)
.style("left", (event.pageX + 10) + "px").style("top", (event.pageY - 20) + "px");})
.on("mouseout", () => tooltip.style("opacity", 0));
});
</script>
</body>
</html>
