<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task 9 - Focus & Context Zoom</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body { font-family: sans-serif; margin: 30px; }
button { padding: 6px 12px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 10px; }
</style>
</head>
<body>
<h2>Task 9: Interactive Zoomable Overview</h2>
<button id="reset-btn">Reset Zoom</button>
<div id="chart"></div>

<script>
const margin = { top: 15, right: 30, bottom: 90, left: 50 };
const marginContext = { top: 270, right: 30, bottom: 20, left: 50 };
const width = 800 - margin.left - margin.right;
const hFocus = 330 - margin.top - margin.bottom;
const hContext = 330 - marginContext.top - marginContext.bottom;

function parseRowDate(raw) {
if (raw instanceof Date) return raw;
if (typeof raw === "number") return new Date((raw - 25569) * 86400 * 1000);
return d3.timeParse("%Y-%m-%d")(String(raw).trim().split("T")[0]);}

async function loadData() {
try {
const res = await fetch("dataset/air_quality_2025.xlsx");
if (!res.ok) throw new Error();
const wb = XLSX.read(await res.arrayBuffer(), { type: "array", cellDates: true });
return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);} 
catch {return await d3.csv("dataset/air_quality_2025.csv");}}

loadData().then(rows => {
const data = rows.map(d => ({
date: parseRowDate(d.date),
pm25: +d.pm25_city})).filter(d => d.date && !isNaN(d.date)).sort((a,b) => a.date - b.date);

const svg = d3.select("#chart").append("svg").attr("width", width + margin.left + margin.right).attr("height", 330);

const xFocus = d3.scaleTime().domain(d3.extent(data, d => d.date)).range([0, width]);
const xContext = d3.scaleTime().domain(xFocus.domain()).range([0, width]);
const yFocus = d3.scaleLinear().domain([0, d3.max(data, d => d.pm25) + 15]).range([hFocus, 0]);
const yContext = d3.scaleLinear().domain(yFocus.domain()).range([hContext, 0]);

const xAxisFocus = d3.axisBottom(xFocus).tickFormat(d3.timeFormat("%b"));
const xAxisContext = d3.axisBottom(xContext).tickFormat(d3.timeFormat("%b"));

svg.append("defs").append("clipPath").attr("id", "clip").append("rect").attr("width", width).attr("height", hFocus);

const focus = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);
const context = svg.append("g").attr("transform", `translate(${marginContext.left},${marginContext.top})`);

const focusLine = d3.line().x(d => xFocus(d.date)).y(d => yFocus(d.pm25));
const contextLine = d3.line().x(d => xContext(d.date)).y(d => yContext(d.pm25));

const focusPath = focus.append("path").datum(data).attr("clip-path", "url(#clip)").attr("fill", "none").attr("stroke", "#2563eb").attr("stroke-width", 1.5).attr("d", focusLine);

const gXFocus = focus.append("g").attr("transform", `translate(0,${hFocus})`).call(xAxisFocus);
focus.append("g").call(d3.axisLeft(yFocus));

context.append("path").datum(data).attr("fill", "none").attr("stroke", "#94a3b8").attr("stroke-width", 1).attr("d", contextLine);
context.append("g").attr("transform", `translate(0,${hContext})`).call(xAxisContext);

const brush = d3.brushX().extent([[0, 0], [width, hContext]]).on("brush end", brushed);
const gBrush = context.append("g").call(brush);

function brushed(event) {
const s = event.selection;
if (s) {xFocus.domain([xContext.invert(s[0]), xContext.invert(s[1])]);} 
else {xFocus.domain(xContext.domain());}
focusPath.attr("d", focusLine);
gXFocus.call(xAxisFocus);}

d3.select("#reset-btn").on("click", () => gBrush.call(brush.move, null));});
</script>
</body>
</html>
