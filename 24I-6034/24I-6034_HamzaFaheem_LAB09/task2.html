<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Structure Dendrogram</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
body {font-family: Arial, sans-serif;}
.node {cursor: pointer;}

.node circle {
stroke: #fff;
stroke-width: 1.5px;}

.node text {font-size: 12px;}

.link {
fill: none;
stroke: #ccc;
stroke-width: 1.5px;}

</style>
</head>
<body>

<h2>University Structure Dendrogram</h2>
<p>Click on a department node to collapse or expand its courses.</p>
<div id="dendrogram-container"></div>

<script>
const margin = {top: 20, right: 120, bottom: 20, left: 120},
width = 960 - margin.right - margin.left,
height = 600 - margin.top - margin.bottom;

const svg = d3.select("#dendrogram-container").append("svg")
.attr("width", width + margin.right + margin.left)
.attr("height", height + margin.top + margin.bottom)
.append("g")
.attr("transform", "translate(" + margin.left + "," + margin.top + ")");

let i = 0,
duration = 750,
root;

const diagonal = d3.linkHorizontal().x(d => d.y).y(d => d.x);
const tree = d3.tree().size([height, width]);

d3.csv("dataset/university.csv").then(data => {
const groupedData = d3.group(data, d => d.department);

const treeData = {
name: "University",
children: Array.from(groupedData, ([department, courses]) => ({name: department, children: courses.map(c => ({ name: c.course }))}))
};

root = d3.hierarchy(treeData, d => d.children);
root.x0 = height / 2;
root.y0 = 0;

update(root);
}).catch(error => {console.error("Error loading the CSV data:", error);});

function collapse(d) {
if(d.children) {
d._children = d.children;
d._children.forEach(collapse);
d.children = null;}}

function update(source) {
const treeData = tree(root);
const nodes = treeData.descendants(),
links = treeData.descendants().slice(1);

nodes.forEach(d => { d.y = d.depth * 250; });

const node = svg.selectAll("g.node").data(nodes, d => d.id || (d.id = ++i));
const nodeEnter = node.enter().append("g").attr("class", "node").attr("transform", d => `translate(${source.y0},${source.x0})`).on("click", click);

nodeEnter.append("circle").attr("r", 1e-6).style("fill", d => colorByDepth(d));
nodeEnter.append("text").attr("dy", ".35em").attr("x", d => d.children || d._children ? -13 : 13).attr("text-anchor", d => d.children || d._children ? "end" : "start").text(d => d.data.name);

const nodeUpdate = nodeEnter.merge(node);

nodeUpdate.transition().duration(duration).attr("transform", d => `translate(${d.y},${d.x})`);

nodeUpdate.select("circle").attr("r", 8).style("fill", d => colorByDepth(d)).style("stroke", d => d._children ? "#000" : "#fff");

const nodeExit = node.exit().transition().duration(duration).attr("transform", d => `translate(${source.y},${source.x})`).remove();

nodeExit.select("circle").attr("r", 1e-6);
nodeExit.select("text").style("fill-opacity", 1e-6);


const link = svg.selectAll("path.link").data(links, d => d.id);

const linkEnter = link.enter().insert("path", "g").attr("class", "link").attr("d", d => {
const o = {x: source.x0, y: source.y0};
return diagonal({source: o, target: o});
});

const linkUpdate = linkEnter.merge(link);

linkUpdate.transition().duration(duration).attr("d", d => diagonal({source: d.parent, target: d}));

const linkExit = link.exit().transition()
.duration(duration)
.attr("d", d => {
const o = {x: source.x, y: source.y};
return diagonal({source: o, target: o});
}).remove();

nodes.forEach(d => {
d.x0 = d.x;
d.y0 = d.y;});
}

function colorByDepth(d) {
if (d.depth === 0) return "#d73027"; 
if (d.depth === 1) return "#4575b4"; 
return "#74add1";}

function click(event, d) {
if (d.children) {
d._children = d.children;
d.children = null;} 
else {
d.children = d._children;
d._children = null;}
update(d);}
</script>
</body>
</html>
